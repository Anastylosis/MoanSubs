{{define "login.html"}}
<h1>Log in</h1>
{{if .Error}}<div class="error">{{.Error}}</div>{{end}}
<form method="post" action="/login" class="stack">
  <label for="name">Name</label>
  <input type="text" id="name" name="name" value="{{.Name}}" autofocus required autocomplete="username">
  <label for="password">Password</label>
  <input type="password" id="password" name="password" required autocomplete="current-password">
  <p class="hint">Logging in sets a cookie for this browser. An account created via the API with no password can't log in here until an admin sets one.</p>
  <button type="submit">Log in</button>
</form>
{{if registrationOpen}}<p class="hint">No account? <a href="/register">Create one</a>.</p>{{end}}
{{end}}

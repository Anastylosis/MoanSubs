{{define "login.html"}}
<h1>Log in</h1>
{{if .Error}}<div class="error">{{.Error}}</div>{{end}}
<form method="post" action="/login" class="stack">
  <label for="token">Upload token</label>
  <input type="password" id="token" name="token" class="mono" autofocus required autocomplete="off">
  <p class="hint">The token you got when the account was created. Logging in sets a cookie for this browser; the token itself isn't kept.</p>
  <button type="submit">Log in</button>
</form>
<p class="hint" style="margin-top:1.5rem">No account? <a href="/register">Create one</a>.</p>
{{end}}

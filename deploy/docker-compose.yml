# Reference stack for a public moansubs node: Traefik terminates TLS and is
# the only thing that talks to `server` directly, `server` runs the API, and
# Postgres holds all state. A fourth service, `backup`, takes a nightly
# pg_dump to object storage via rclone; it sits behind a compose profile, so
# `docker compose up -d` brings up three containers and adding backups is an
# explicit `--profile backup` rather than something that must be configured
# before the node can start at all.
#
# DOMAIN, ACME_EMAIL and POSTGRES_PASSWORD are the only values that must be
# set before `docker compose up -d`. See README.md for first boot, upgrades,
# TLS without Let's Encrypt, and the restore drill.

# json-file is the daemon default, which keeps no cap of its own — a long-
# running node's logs (this compose file's own request-log line included,
# WP-P5/MANUAL.md "Operating") grow without bound. One anchor, applied to
# every service below, caps each container at 100MiB (5 x 20m) of on-disk
# log rather than each needing its own copy of the same three lines.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  traefik:
    # v3.7 or newer. Up to and including v3.5 the Docker provider asked for
    # API version 1.24 and never negotiated, which a current daemon (minimum
    # 1.40) refuses outright -- the provider then discovers no containers at
    # all, so TLS terminates perfectly and every request still 404s. Setting
    # DOCKER_API_VERSION does not help; Traefik builds its own client and
    # ignores it. Upgrading is the fix.
    image: traefik:v3.7
    restart: unless-stopped
    logging: *default-logging
    # Routing lives on the `server` service's labels (below); everything
    # static lives here. The dashboard and the insecure API are deliberately
    # never enabled -- this container is on the public internet.
    #
    # TLS is attached to the entrypoint rather than to the router, so the
    # override in docker-compose.tls-file.yml can drop ACME entirely by
    # replacing this one list. A router-level certresolver label could not
    # be removed by an override, only pointed somewhere else.
    command:
      # /ping on its own port, for the healthcheck below. Deliberately NOT
      # on an entrypoint that is published: the answer says only "Traefik is
      # answering", and there is no reason for the internet to be able to
      # ask. 8082 is reachable from inside this container and nowhere else.
      - --ping=true
      - --ping.entrypoint=ping
      - --entrypoints.ping.address=:8082
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      # Only this stack's containers. The Docker provider watches the whole
      # daemon, not this project -- so a second moansubs stack on the same
      # host (a staging copy, or one left running from an earlier deploy)
      # registers its server under the *same* router and service names and
      # gets load-balanced into this one. Its containers sit on another
      # network this Traefik cannot dial, so roughly half of all requests
      # answer 504 while the rest are fine: an intermittent outage with
      # nothing wrong in either stack's own logs. DOMAIN is what makes each
      # stack unique, so it is what scopes the provider.
      - "--providers.docker.constraints=Label(`moansubs.domain`,`${DOMAIN}`)"
      # Anything that is not a container -- an external analytics upstream,
      # a certificate you supply yourself -- cannot be expressed as a
      # Docker label, so the file provider covers those. The directory is
      # empty by default and watched, so dropping a file in takes effect
      # without a restart. See dynamic/*.yml.example.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # Trusts a CDN's own edge ranges for X-Forwarded-For rewriting, same
      # CIDRs as MOANSUBS_TRUSTED_PROXY_CIDRS below -- see deploy/README.md
      # "Behind Cloudflare (or another CDN)". Empty is fine: Traefik accepts
      # a blank trustedIPs (verified against v3.7) and just trusts nothing.
      - --entrypoints.web.forwardedHeaders.trustedIPs=${UPSTREAM_PROXY_CIDRS:-}
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=${UPSTREAM_PROXY_CIDRS:-}
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certResolver=le
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL, the address Let's Encrypt sends expiry warnings to}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only, but still the host's Docker socket: anything that can
      # read it can enumerate and control every container on this host.
      # README.md ("Why Traefik sees the Docker socket") covers what that
      # means and how to take it away with a socket proxy.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      # Issued certificates and the ACME account key. Losing this volume
      # means re-issuing from scratch, which Let's Encrypt rate-limits.
      - traefik_acme:/acme
    # Without this, `docker compose ps` can only say the process is up —
    # not whether it is actually serving. It also makes every container in
    # this stack report health, rather than some reporting and some not.
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=ping", "--entrypoints.ping.address=:8082"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - server

  server:
    # Set MOANSUBS_TAG in .env to pin a version. Doing so is recommended
    # for anything you care about: `serve` applies pending migrations on
    # startup, so the version you run is the version your schema gets, and
    # choosing that deliberately is worth the one line.
    #
    # The default is a moving tag rather than a number so this file does not
    # have to be edited on every release. That is less dangerous than it
    # sounds: a restart policy restarts the existing container, which holds
    # a resolved image id, so a reboot never changes versions under you.
    # Only an explicit `docker compose pull` moves a moving tag.
    #
    # No leading "v" if you do pin: the git tags are v0.3.0 but the image
    # tags are 0.3.0 / 0.3 / 0 / latest, which is the usual convention for
    # image tags and an easy mismatch to write by accident.
    image: ghcr.io/anastylosis/moansubs:${MOANSUBS_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    # `serve` applies pending migrations on startup (MANUAL.md), so
    # `docker compose pull && up -d` is a complete upgrade on its own.
    # Optional YAML config, mounted read-only. Copy config.example.yaml from
    # the repository to ./config.yaml beside this file and uncomment; the
    # environment below still wins over anything it sets, which is what
    # lets this compose file override an image without editing the file.
    # Keep credentials in the environment rather than in it: the server
    # refuses to start on a config file that names database_url or
    # token_key and is readable by anyone but its owner.
    # volumes:
    #   - ./config.yaml:/etc/moansubs/config.yaml:ro
    environment:
      DATABASE_URL: postgres://moansubs:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/moansubs?sslmode=disable
      MOANSUBS_LISTEN: ":8080"
      # Traefik is the only thing that reaches `server` directly on this
      # stack, always from this compose network — see the "Trust proxy
      # note" in README.md before changing or removing this. A CDN in front
      # of Traefik (UPSTREAM_PROXY_CIDRS, unset by default) appends its own
      # ranges here too — see "Behind Cloudflare (or another CDN)".
      MOANSUBS_TRUSTED_PROXY_CIDRS: "${MOANSUBS_SUBNET:-172.28.0.0/24}${UPSTREAM_PROXY_CIDRS:+,${UPSTREAM_PROXY_CIDRS}}"
      # Lets /me show an account's API token again after this container
      # restarts, instead of only right after it was minted/rotated.
      # Generate one with `openssl rand -hex 32` (64 hex chars); genuinely
      # optional (MANUAL.md, SECURITY.md) -- leaving it unset is a safe
      # default, tokens just aren't redisplayable and /me says so.
      MOANSUBS_TOKEN_KEY: ${MOANSUBS_TOKEN_KEY:-}
      # This node's origin as visitors reach it. Unset derives it per
      # request from Host, which is right for a single-name node; set it
      # once a node answers to more than one, so the sitemap and every
      # og:url name one canonical form. Behind this stack's proxy the
      # scheme is read from X-Forwarded-Proto, trusted because
      # MOANSUBS_TRUSTED_PROXY_CIDRS names Traefik above.
      MOANSUBS_PUBLIC_URL: ${MOANSUBS_PUBLIC_URL:-}
      # Auto-confirm, off by default: lets a trusted account's
      # stash-box-backed metadata pin itself instead of waiting for a
      # moderator. Does NOTHING until an account is marked with
      # `moansubs account trust <name>` -- see "Auto-confirm" in
      # README.md, which is also where the failure mode is written down.
      # MOANSUBS_AUTOCONFIRM: "true"
      # Which stash-boxes' ids may pin a name unreviewed. Narrower than
      # MOANSUBS_STASH_ENDPOINTS on purpose -- see README.md.
      # MOANSUBS_AUTOCONFIRM_ENDPOINTS: "https://stashdb.org/graphql,https://theporndb.net/graphql"
      # Search-engine indexing, off by default. Read "Indexing and the age
      # gate" in MANUAL.md before turning it on: on a node with the age
      # gate up it also lets crawlers past the click-through, which is a
      # deliberate trade rather than a free win. It is also what makes
      # /sitemap.xml exist -- and nothing is listed in it until a
      # moderator pins releases ("Getting listed", MANUAL.md).
      # MOANSUBS_INDEXABLE: "true"
      # Visitor analytics, off by default. The path form below pairs with
      # the /s/* router in this file, which keeps the tag same-origin — see
      # "Analytics" in README.md. An absolute https:// URL also works.
      # MOANSUBS_ANALYTICS_SCRIPT: "/s/script.js"
      # MOANSUBS_ANALYTICS_WEBSITE_ID: ${MOANSUBS_ANALYTICS_WEBSITE_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Traefik discovers the node here. exposedbydefault=false means nothing
    # is routed without traefik.enable, so postgres and backup stay
    # invisible to the proxy no matter what else changes.
    labels:
      - traefik.enable=true
      # Read by the provider constraint in the traefik service above.
      - moansubs.domain=${DOMAIN}
      - "traefik.http.routers.moansubs.rule=Host(`${DOMAIN}`)"
      - traefik.http.routers.moansubs.entrypoints=websecure
      - traefik.http.services.moansubs.loadbalancer.server.port=8080
      - traefik.http.routers.moansubs.middlewares=moansubs-compress,moansubs-hsts
      - traefik.http.middlewares.moansubs-compress.compress=true
      # A year of HSTS, matching what the reference proxy has always sent.
      # Add preload only when you are certain this name will never be
      # served over plain HTTP again.
      - traefik.http.middlewares.moansubs-hsts.headers.stsSeconds=31536000

  docs:
    # End-user documentation, static HTML behind nginx. Follows MOANSUBS_TAG
    # so a release deploys the docs written for it. Routed only when
    # DOCS_DOMAIN is set; the fallback host never matches.
    image: ghcr.io/anastylosis/moansubs-docs:${MOANSUBS_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    labels:
      - traefik.enable=true
      - moansubs.domain=${DOMAIN}
      - "traefik.http.routers.moansubs-docs.rule=Host(`${DOCS_DOMAIN:-docs.invalid}`)"
      - traefik.http.routers.moansubs-docs.entrypoints=websecure
      - traefik.http.services.moansubs-docs.loadbalancer.server.port=8080
      - traefik.http.routers.moansubs-docs.middlewares=moansubs-compress,moansubs-hsts

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: moansubs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: moansubs
    volumes:
      # Mounted at /var/lib/postgresql, not .../data: the 18+ images store
      # the cluster in a major-version-specific subdirectory so pg_upgrade
      # can run without crossing a mount boundary. An image built for 17 or
      # earlier expects the .../data path instead, so this line and the tag
      # above have to move together.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moansubs -d moansubs"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    # Opt-in: `docker compose --profile backup up -d`. Off by default so a
    # first boot is not blocked on having object storage and an rclone
    # config ready -- see "Backups" in README.md.
    profiles: ["backup"]
    build: ./backup
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGHOST: postgres
      PGUSER: moansubs
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: moansubs
      # Name of an rclone remote configured in the mounted rclone.conf
      # below, e.g. "s3" for an [s3] remote section.
      RCLONE_REMOTE: s3
      BACKUP_BUCKET: <bucket>
      BACKUP_RETENTION_DAYS: "30"
    volumes:
      # Not tracked here (CLAUDE.md: no private infra details in tracked
      # files) — create it yourself; see README.md.
      - ./backup/rclone.conf:/root/.config/rclone/rclone.conf:ro
      # backup.sh touches last-success here only after a dump has actually
      # landed on the remote; the healthcheck below reads its mtime. Named
      # rather than bind-mounted so nothing host-side has to exist first.
      - backup_state:/var/lib/backup
    healthcheck:
      # Cron (crontab) runs backup.sh once nightly, so this only needs to
      # notice a *stale* success, not a fresh one -- unhealthy when
      # last-success is missing (no dump has ever succeeded) or older than
      # 48h (one missed night plus slack), so a broken backup job shows up
      # in `docker ps` instead of only in scrollback nobody is watching.
      test: ["CMD-SHELL", "test -n \"$(find /var/lib/backup/last-success -mmin -2880 2>/dev/null)\""]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 1m
    depends_on:
      postgres:
        condition: service_healthy

# A fixed subnet, not the default dynamically-assigned one, so
# MOANSUBS_TRUSTED_PROXY_CIDRS above names an address range that's actually
# stable across `docker compose up` runs. Both read the same variable, so a
# host that already uses this range needs one line in .env, not an edit here
# -- and they cannot drift apart, which would silently stop the rate
# limiters trusting X-Forwarded-For.
networks:
  default:
    ipam:
      config:
        - subnet: ${MOANSUBS_SUBNET:-172.28.0.0/24}

volumes:
  pgdata:
  traefik_acme:
  backup_state:

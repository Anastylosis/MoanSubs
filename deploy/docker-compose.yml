# Reference stack for a public moansubs node: Caddy terminates TLS and is
# the only thing that talks to `server` directly, `server` runs the API,
# Postgres holds all state, and `backup` takes a nightly pg_dump to object
# storage via rclone with a 30-day retention. Generic on purpose — every
# placeholder below (DOMAIN, <bucket>, POSTGRES_PASSWORD, MOANSUBS_TAG,
# MOANSUBS_TOKEN_KEY) needs a real value before `docker compose up -d`. See
# README.md for the first-boot, upgrade and restore steps.

# json-file is the daemon default, which keeps no cap of its own — a long-
# running node's logs (this compose file's own request-log line included,
# WP-P5/MANUAL.md "Operating") grow without bound. One anchor, applied to
# every service below, caps each container at 100MiB (5 x 20m) of on-disk
# log rather than each needing its own copy of the same three lines.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the node's hostname, e.g. subs.example.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - server

  server:
    # No release has been cut yet (README.md "Status"), so there is no
    # default tag to fall back to — MOANSUBS_TAG must name a real one.
    image: ghcr.io/anastylosis/moansubs:${MOANSUBS_TAG:?set MOANSUBS_TAG to a released version}
    restart: unless-stopped
    logging: *default-logging
    # `serve` applies pending migrations on startup (MANUAL.md), so
    # `docker compose pull && up -d` is a complete upgrade on its own.
    environment:
      DATABASE_URL: postgres://moansubs:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/moansubs?sslmode=disable
      MOANSUBS_LISTEN: ":8080"
      # Caddy is the only thing that reaches `server` directly on this
      # stack, always from this compose network — see the "Trust proxy
      # note" in README.md before changing or removing this.
      MOANSUBS_TRUSTED_PROXY_CIDRS: "172.28.0.0/24"
      # Lets /me show an account's API token again after this container
      # restarts, instead of only right after it was minted/rotated.
      # Generate one with `openssl rand -hex 32` (64 hex chars); genuinely
      # optional (MANUAL.md, SECURITY.md) -- leaving it unset is a safe
      # default, tokens just aren't redisplayable and /me says so.
      MOANSUBS_TOKEN_KEY: ${MOANSUBS_TOKEN_KEY:-}
      # Search-engine indexing, off by default. Read "Indexing and the age
      # gate" in MANUAL.md before turning it on: on a node with the age
      # gate up it also lets crawlers past the click-through, which is a
      # deliberate trade rather than a free win.
      # MOANSUBS_INDEXABLE: "true"
      # Visitor analytics, off by default. The path form below pairs with
      # the /s/* proxy in Caddyfile, which keeps the tag same-origin — see
      # "Analytics" in README.md. An absolute https:// URL also works.
      # MOANSUBS_ANALYTICS_SCRIPT: "/s/script.js"
      # MOANSUBS_ANALYTICS_WEBSITE_ID: ${MOANSUBS_ANALYTICS_WEBSITE_ID:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: moansubs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: moansubs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moansubs -d moansubs"]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    build: ./backup
    restart: unless-stopped
    logging: *default-logging
    environment:
      PGHOST: postgres
      PGUSER: moansubs
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: moansubs
      # Name of an rclone remote configured in the mounted rclone.conf
      # below, e.g. "s3" for an [s3] remote section.
      RCLONE_REMOTE: s3
      BACKUP_BUCKET: <bucket>
      BACKUP_RETENTION_DAYS: "30"
    volumes:
      # Not tracked here (CLAUDE.md: no private infra details in tracked
      # files) — create it yourself; see README.md.
      - ./backup/rclone.conf:/root/.config/rclone/rclone.conf:ro
      # backup.sh touches last-success here only after a dump has actually
      # landed on the remote; the healthcheck below reads its mtime. Named
      # rather than bind-mounted so nothing host-side has to exist first.
      - backup_state:/var/lib/backup
    healthcheck:
      # Cron (crontab) runs backup.sh once nightly, so this only needs to
      # notice a *stale* success, not a fresh one -- unhealthy when
      # last-success is missing (no dump has ever succeeded) or older than
      # 48h (one missed night plus slack), so a broken backup job shows up
      # in `docker ps` instead of only in scrollback nobody is watching.
      test: ["CMD-SHELL", "test -n \"$(find /var/lib/backup/last-success -mmin -2880 2>/dev/null)\""]
      interval: 1h
      timeout: 10s
      retries: 1
      start_period: 1m
    depends_on:
      postgres:
        condition: service_healthy

# A fixed subnet, not the default dynamically-assigned one, so
# MOANSUBS_TRUSTED_PROXY_CIDRS above names an address range that's actually
# stable across `docker compose up` runs.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backup_state:

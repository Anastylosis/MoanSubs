# Example compose file for self-hosting moansubs. Copy to docker-compose.yml
# and adjust before running `docker compose up`.
services:
  server:
    # Pinned rather than a moving tag, so a restart cannot change versions
    # under you. To run local changes instead, comment this out and
    # uncomment the build line below.
    image: ghcr.io/anastylosis/moansubs:0.1.1
    # build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MOANSUBS_LISTEN: ":8080"
      DATABASE_URL: "postgres://moansubs:moansubs@postgres:5432/moansubs?sslmode=disable"
      # Both optional and off by default — see MANUAL.md. Indexing also
      # changes how the age gate treats crawlers; analytics needs both
      # variables or the server refuses to start.
      # MOANSUBS_INDEXABLE: "true"
      # MOANSUBS_ANALYTICS_SCRIPT: "https://analytics.example/script.js"
      # MOANSUBS_ANALYTICS_WEBSITE_ID: "00000000-0000-0000-0000-000000000000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: moansubs
      POSTGRES_PASSWORD: moansubs
      POSTGRES_DB: moansubs
    volumes:
      # Mounted at /var/lib/postgresql, not .../data: the 18+ images store
      # the cluster in a major-version-specific subdirectory so pg_upgrade
      # can run without crossing a mount boundary. An image built for 17 or
      # earlier expects the .../data path instead, so this line and the tag
      # above have to move together.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moansubs -d moansubs"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:

name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Upload a subtitle with `curl -X POST .../api/v1/subtitles ...`
        2. Observe error
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output / error message
      description: Paste the relevant output (server log, plugin task log, or HTTP response). Use a code block.
      render: text

  - type: input
    id: versions
    attributes:
      label: Versions
      description: moansubs version (`moansubs --version`), plugin version, Stash version
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Server / API
        - Plugin (exec half / tasks)
        - Plugin (UI)
        - Deployment / Docker
        - Other
    validations:
      required: true

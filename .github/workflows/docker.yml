name: Docker (dev images)

# Tag-based releases are handled by the gated docker job in release.yml, so a
# v* image cannot ship without the manual smoke-test approval. This workflow
# publishes development images only: tip-of-default-branch and per-commit
# `sha-<short>`, plus PR-only sanity builds.
on:
  push:
    branches: [main, master]
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    uses: Anastylosis/.github/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      # attest-build-provenance needs OIDC + attestation write. The attestation
      # is stored on the workflow run, not in the registry image index, so the
      # manifest list stays free of `unknown/unknown` entries.
      id-token: write
      attestations: write
    with:
      mode: dev

  docs:
    uses: Anastylosis/.github/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      mode: dev
      image-name: anastylosis/moansubs-docs
      dockerfile: ./docs/Dockerfile
      go-version-build-arg: false
      version-build-args: false

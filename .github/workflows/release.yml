name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    uses: Anastylosis/.github/.github/workflows/go-release.yml@v1
    permissions:
      # contents: write to publish the release and discussions: write to open
      # its announcement thread; the rest are for attest-build-provenance over
      # the downloadable artifacts.
      contents: write
      discussions: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      binary-name: moansubs
      main-package: ./cmd/moansubs
      # Only the two platforms the Dockerfile also builds. moansubs is a
      # server: nobody runs it from a macOS or Windows binary.
      platforms: 'linux/amd64 linux/arm64'
      # Pauses until a reviewer of the `manual-smoke-gate` environment approves,
      # attesting they ran the release checklist against a live Stash — the one
      # thing CI cannot reach. The Postgres tests and the migration upgrade
      # path are ci.yml's job (`migration-upgrade`), so they are deliberately
      # not in the checklist below. The docker and plugin jobs inherit the gate
      # transitively via `needs`, so one approval covers all three. See
      # CONTRIBUTING.md → "Cutting a release".
      environment-name: manual-smoke-gate
      environment-url: ${{ github.server_url }}/${{ github.repository }}/blob/master/CONTRIBUTING.md#approver-checklist
      pre-release-checklist: |
        - [ ] This tag's plugin bundle installs into a live Stash, and
              **Settings → Plugins → Reload plugins** shows it without error.
        - [ ] One subtitle fetched end to end through the plugin against that Stash.
        - [ ] Release notes describe the user-visible changes, and the tag
              annotation says anything the commits cannot.

        The Postgres tests and the migration-upgrade path are covered by CI
        now. If either job is red, **do not approve** — the gate does not
        block on them.
      pre-release-notice: >-
        I installed this tag's plugin bundle into a live Stash, reloaded plugins,
        and fetched a subtitle end to end. Every check passed. I reviewed the
        release notes.
      # The category must already exist; renaming it on GitHub without changing
      # it here fails the API call after the gate has been approved.
      discussion-category: Announcements
      docker-image: ghcr.io/anastylosis/moansubs
      install-instructions: |
        The primary way to run moansubs is Docker:

        ```sh
        docker pull ghcr.io/anastylosis/moansubs:{{version}}
        ```

        Or with `docker-compose.example.yml` (copy to `docker-compose.yml`,
        adjust, then `docker compose up`).

        Static Linux binaries are also attached to this release for
        linux/amd64 and linux/arm64:

        ```sh
        tar xzf moansubs-${{ github.ref_name }}-linux-amd64.tar.gz
        chmod +x moansubs
        ./moansubs --version
        ```

        ### Stash plugin

        The plugin bundle unpacks straight into your Stash plugins
        directory, then **Settings → Plugins → Reload plugins**:

        ```sh
        tar xzf moansubs-plugin-${{ github.ref_name }}-linux-amd64.tar.gz \
          -C /path/to/stash/plugins
        ```

        Pick the bundle matching the architecture Stash itself runs on —
        the exec half is a static native binary, so an arm64 NAS needs the
        arm64 bundle even when the server runs elsewhere. Configure the
        server URL (and an upload token, for pushing) in the plugin's
        settings; see plugin/README.md.

  # Gated behind the release job, so no image lands on GHCR unless the manual
  # approval went through.
  docker:
    name: Build and push docker image
    needs: release
    uses: Anastylosis/.github/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      # attest-build-provenance needs OIDC + attestation write. The attestation
      # is stored on the workflow run, not in the registry image index, so the
      # manifest list stays free of `unknown/unknown` entries.
      id-token: write
      attestations: write
    with:
      mode: release

  docs:
    name: Build and push docs image
    needs: release
    uses: Anastylosis/.github/.github/workflows/docker-publish.yml@v1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      mode: release
      image-name: anastylosis/moansubs-docs
      dockerfile: ./docs/Dockerfile
      go-version-build-arg: false
      version-build-args: false

  # Also gated behind the release job: the bundles are attached to a release
  # that only exists once the manual approval went through, and the index is
  # only advertised for a release that exists.
  #
  # Everything here is arch-specific because the exec half is a native binary
  # and Stash's package source has no notion of architecture. See
  # scripts/plugin-package.sh for the two archive shapes and why they differ.
  plugin:
    name: Package and attach the Stash plugin
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Full history: this job commits to gh-pages, and pushing a branch
          # from the default shallow clone is not reliable.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build plugin binaries
        run: make plugin

      - name: Package plugin bundles and index
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/plugin-package.sh "$TAG" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}" \
            dist-plugin

      - name: Attach bundles to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist-plugin/*.zip dist-plugin/*.tar.gz --clobber

      # The index lives on a stable URL while the zips it points at are
      # per-release assets — Stash resolves an absolute `path` as-is
      # (pkg/pkg/repository_http.go resolvePath), so nothing has to be mirrored
      # here. Users add the URL once and every later release reaches them.
      - name: Publish the package index to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout -B gh-pages origin/gh-pages
          else
            # First release: an orphan branch, so the site carries no source
            # history it has no reason to hold.
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null
          fi

          mkdir -p plugin/amd64 plugin/arm64
          cp dist-plugin/index-amd64.yml plugin/amd64/index.yml
          cp dist-plugin/index-arm64.yml plugin/arm64/index.yml

          git add plugin/amd64/index.yml plugin/arm64/index.yml
          git commit -m "Plugin package index for ${TAG}"
          git push origin gh-pages

# moansubs Stash plugin. The exec half is a static Go binary speaking the
# RPC plugin interface — rpc rather than raw so long tasks get a graceful
# Stop instead of being killed with no signal.
#
# The UI half (moansubs.js) calls the exec half via runPluginOperation, so
# network egress to the moansubs server happens in the exec process, which
# has no CSP — the server address stays a plugin setting rather than a
# manifest-baked connect-src, and no csp block is needed here at all.
name: moansubs
description: Search and download subtitles for scenes from a moansubs server.
version: 0.2.0
exec:
  - moansubs-plugin
interface: rpc
errLog: error

ui:
  javascript:
    - moansubs.js

settings:
  server_url:
    displayName: moansubs server URL
    description: Base URL of a moansubs server. Leave empty for the public node (https://moansubs.org).
    type: STRING
  token:
    displayName: Upload token
    description: Account token for uploading subtitles (optional; downloads are anonymous)
    type: STRING
  stash_api_key:
    displayName: Stash API key
    description: Used instead of the session cookie, which expires mid-run on long tasks
    type: STRING
  hide_push_button:
    displayName: Hide the per-scene push button
    description: Stop offering "Push local subs" on scene pages. Worded as an opt-out because a Stash checkbox cannot default to checked - leave it unticked and the button appears whenever a scene has local subtitles and an upload token is set.
    type: BOOLEAN
  exact_mode:
    displayName: Full-hash lookup
    description: Send full fingerprints to the server for wider fuzzy matching (reveals exact hashes to the server operator)
    type: BOOLEAN

tasks:
  - name: Probe
    description: Check connectivity to Stash and the moansubs server
    defaultArgs:
      mode: probe
  - name: Push subtitles (dry run)
    description: Report which sidecar subtitles would be uploaded, without uploading
    defaultArgs:
      mode: push_all
      dry_run: true
  - name: Push subtitles
    description: Upload every sidecar subtitle in the library to the moansubs server (safe to re-run)
    defaultArgs:
      mode: push_all
  - name: Contribute scene details (dry run)
    description: Report which scenes' titles, dates, studios, performers and stash-box ids would be sent, without sending
    defaultArgs:
      mode: contribute_all
      dry_run: true
  - name: Contribute scene details
    description: Tell the server what your scenes are - no subtitles uploaded, only names. Needs an upload token.
    defaultArgs:
      mode: contribute_all
